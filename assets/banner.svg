<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 800; fill: url(#textGrad); }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #8b949e; letter-spacing: 0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #58a6ff; }
    
    /* Dynamic / Animated Elements */
    @keyframes pulseNode {
      0% { r: 6px; opacity: 0.4; }
      50% { r: 12px; opacity: 0.9; }
      100% { r: 6px; opacity: 0.4; }
    }

    @keyframes waveDash {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .pulsing-dot-1 { animation: pulseNode 3s infinite ease-in-out; fill: #58a6ff; }
    .pulsing-dot-2 { animation: pulseNode 4s infinite ease-in-out 1s; fill: #bc8cff; }
    .pulsing-dot-3 { animation: pulseNode 3.5s infinite ease-in-out 0.5s; fill: #3fb950; }
    
    .connecting-line {
      stroke: #30363d;
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
    }
    
    .animated-line {
      stroke: url(#textGrad);
      stroke-width: 2;
      stroke-dasharray: 200;
      animation: waveDash 10s linear infinite;
    }

    .pill-container { animation: floatPill 6s infinite ease-in-out; }
    .pill-container-2 { animation: floatPill 7s infinite ease-in-out 2s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" class="bg" rx="12" />

  <!-- Animated Neural/NLP Grid Lines in Background -->
  <g opacity="0.3">
    <path d="M 100 80 Q 300 20 500 120 T 900 60 T 1100 200" fill="none" class="connecting-line" />
    <path d="M 50 250 Q 350 290 650 200 T 1050 280" fill="none" class="connecting-line" />
    <path d="M 100 80 Q 300 20 500 120 T 900 60 T 1100 200" fill="none" class="animated-line" />
  </g>

  <!-- Animated Floating NLP Nodes in Background / Margins -->
  <g opacity="0.6">
    <circle cx="1020" cy="70" r="8" class="pulsing-dot-1" />
    <circle cx="1110" cy="130" r="10" class="pulsing-dot-2" />
    <line x1="1020" y1="70" x2="1110" y2="130" stroke="#30363d" stroke-width="1.5" />
    
    <circle cx="90" cy="240" r="9" class="pulsing-dot-3" />
    <circle cx="180" cy="280" r="7" class="pulsing-dot-1" />
    <line x1="90" y1="240" x2="180" y2="280" stroke="#30363d" stroke-width="1.5" />
  </g>

  <!-- Decorative Pills in Dynamic Layers (Side/Bottom) -->
  <g class="pill-container" transform="translate(920, 210)" opacity="0.85">
    <rect width="180" height="36" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#3fb950" />
    <text x="36" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9" font-weight="600">⚡ LLMs &amp; RAG</text>
  </g>

  <g class="pill-container-2" transform="translate(720, 45)" opacity="0.85">
    <rect width="210" height="36" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#bc8cff" />
    <text x="36" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9" font-weight="600">🧠 Sentiment &amp; NER</text>
  </g>

  <!-- Foreground Backdrop Overlay Card to guarantee complete title/subtitle clarity -->
  <rect x="60" y="50" width="620" height="220" rx="16" fill="#0d1117" fill-opacity="0.85" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(90, 100)">
    <rect width="185" height="26" rx="13" fill="#1f6feb" fill-opacity="0.2" stroke="#1f6feb" stroke-opacity="0.5" />
    <text x="14" y="17" class="badge-text">Natural Language Processing</text>

    <text x="0" y="70" class="title-text" filter="url(#shadow)">Awesome NLP</text>

    <text x="0" y="105" class="subtitle-text">Curated Directory of Commercial SaaS APIs &amp; Open-Source NLP Libraries</text>
    <text x="0" y="130" font-family="sans-serif" font-size="13" fill="#8b949e">Updated October 2026 • Enterprise Models, Frameworks &amp; Pipelines</text>
  </g>
</svg>
